# Response headers for every file. Included in each nginx location (a location that sets its own
# add_header drops the server-level ones), and read by `npm run preview` so local previews match.
#
# Referrer-Policy must keep sending the origin: image boards' file hosts refuse requests without one.
# img-src / media-src / connect-src are open because the sites are whatever the person adds.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# A page opened from the app (or the app opened from a page) gets no handle on the other.
add_header Cross-Origin-Opener-Policy "same-origin" always;
# camera=(self): the in-app QR scanner (receiving a transfer from another device).
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * blob:; connect-src *; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

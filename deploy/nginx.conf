# NgGallery: static files served by an unprivileged nginx on port 8080 (main config: nginx-main.conf).
# The app uses hash routing and relative paths, so it also works behind a reverse proxy on a sub-path.

# Device transfer relay (deploy/sync.js): an encrypted transfer waits here a few minutes, in memory,
# and is handed out once. The limits are global on purpose: behind a proxy every visitor has the
# same address anyway, and a global cap on code attempts (10 a minute, so ~50 per 5-minute transfer
# against 100 000 000 possible codes) is what makes guessing a code hopeless.
js_import sync from /etc/nginx/nggallery-sync.js;
# No eviction: when it is full, new transfers are refused (503) instead of pushing out waiting ones.
js_shared_dict_zone zone=sync:96m timeout=300s;
# The secret the code salts are made from (kept until nginx restarts).
js_shared_dict_zone zone=syncsecret:64k;
limit_req_zone $server_name zone=sync_write:1m rate=20r/m;
limit_req_zone $server_name zone=sync_read:1m rate=60r/m;
limit_req_zone $server_name zone=sync_status:1m rate=240r/m;
limit_req_zone $server_name zone=sync_code:1m rate=10r/m;
# Per visitor too, where the CDN in front names them (CF-Connecting-IP; without that header the key is
# empty and nginx counts nothing): one visitor alone can then no longer use up the allowances above,
# which would lock everyone else out of transfers. The global caps stay the last word.
limit_req_zone $http_cf_connecting_ip zone=sync_ip_write:2m rate=3r/m;
limit_req_zone $http_cf_connecting_ip zone=sync_ip_code:2m rate=4r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Redirects (if any) stay relative: never the container's own port or plain http.
    absolute_redirect off;

    # Errors answer with a neutral page of ours, not nginx's own (which names the software).
    error_page 400 403 404 405 413 414 415 429 500 502 503 504 /__error.html;
    location = /__error.html {
        internal;
        root /etc/nginx/nggallery-errors;
        include /etc/nginx/nggallery-headers.conf;
        # (no-transform: as for the app's page, see /index.html below.)
        add_header Cache-Control "no-store, no-transform" always;
    }
    location = /__sync-error.json {
        internal;
        root /etc/nginx/nggallery-errors;
        default_type application/json;
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    charset utf-8;

    # Compression. The build ships a Brotli (.br, maximum quality) and a gzip (.gz, level 9) copy of
    # each text file (scripts/compress.mjs): served as they are, Brotli to browsers that take it,
    # gzip otherwise. On-the-fly gzip only covers what has no copy. The CDN in front caches the result.
    brotli_static on;
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    include /etc/nginx/nggallery-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Device transfer relay (see the top of this file and deploy/sync.js) ----
    location = /sync/v1/health {
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "no-store" always;
        js_content sync.health;
    }
    location = /sync/v1/salt {
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "no-store" always;
        error_page 400 403 404 405 413 414 415 429 500 502 503 504 /__sync-error.json;
        limit_req zone=sync_status burst=40 nodelay;
        limit_req_status 429;
        js_content sync.salt;
    }
    location = /sync/v1/slots {
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "no-store" always;
        error_page 400 403 404 405 413 414 415 429 500 502 503 504 /__sync-error.json;
        # 12 MB of data (deploy/sync.js MAX_DATA) and its JSON wrapping.
        client_max_body_size 13m;
        client_body_buffer_size 13m;
        client_body_in_single_buffer on;
        limit_req zone=sync_write burst=10 nodelay;
        limit_req zone=sync_ip_write burst=3 nodelay;
        limit_req_status 429;
        js_content sync.create;
    }
    location ~ "^/sync/v1/slots/(?<sync_id>[A-Za-z0-9_-]{22})/status$" {
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "no-store" always;
        error_page 400 403 404 405 413 414 415 429 500 502 503 504 /__sync-error.json;
        limit_req zone=sync_status burst=40 nodelay;
        limit_req_status 429;
        js_content sync.status;
    }
    location ~ "^/sync/v1/slots/(?<sync_id>[A-Za-z0-9_-]{22})$" {
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "no-store" always;
        error_page 400 403 404 405 413 414 415 429 500 502 503 504 /__sync-error.json;
        limit_req zone=sync_read burst=20 nodelay;
        limit_req_status 429;
        js_content sync.slot;
    }
    location = /sync/v1/claim {
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "no-store" always;
        error_page 400 403 404 405 413 414 415 429 500 502 503 504 /__sync-error.json;
        client_max_body_size 4k;
        client_body_buffer_size 4k;
        client_body_in_single_buffer on;
        limit_req zone=sync_code burst=5 nodelay;
        limit_req zone=sync_ip_code burst=3 nodelay;
        limit_req_status 429;
        js_content sync.claim;
    }
    # The check page (deploy/check/, see /check below), here for NgGallery 1.9.17 and before, which
    # open it under the relay. no-transform: as for the app's page, nothing injected into it.
    location = /sync/v1/check {
        root /etc/nginx/nggallery-check;
        default_type text/html;
        try_files /check.html =404;
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "no-store, no-transform" always;
    }
    location = /sync/v1/check.js {
        root /etc/nginx/nggallery-check;
        try_files /check.js =404;
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    # Anything else under /sync/: not found (rather than the app's page).
    location /sync/ {
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "no-store" always;
        error_page 404 /__sync-error.json;
        return 404;
    }

    # The page "Pass the check" opens (deploy/check/): a CDN in front may hold this browser's requests
    # for a check that only a page in the browser can pass, and only at addresses it holds: this one is
    # outside the relay's, which a CDN rule may let through. Once loaded, it asks the site and the
    # relay, tells the app and closes itself. The app's service worker leaves it to the network.
    location = /check {
        root /etc/nginx/nggallery-check;
        default_type text/html;
        try_files /check.html =404;
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "no-store, no-transform" always;
    }
    location = /check.js {
        root /etc/nginx/nggallery-check;
        try_files /check.js =404;
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Entry points: always revalidated, so a new version is seen at once.
    # no-transform: the CDN in front leaves the page as it is. Without it, it injects a bot-detection
    # script into every page (Cloudflare's "JavaScript detections", always on with its free plan's bot
    # protection), which the CSP blocks with an error in the console.
    location = /index.html {
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
    }
    location = /sw.js {
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
    }

    # Fingerprinted build output: never changes under the same name.
    # (Not on errors: a missing file must not be cached for a year.)
    location /assets/ {
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~ ^/workbox-[0-9a-f]+\.js$ {
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The root: the app (index.html, with its headers above).
    location = / {
        try_files /index.html =404;
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
    }

    # One address per page: /faq/ (a link written with a trailing slash) goes to /faq instead of
    # answering 404 with the app. Relative, like every redirect here (absolute_redirect off).
    location ~ "^/(?<bare_path>[a-z0-9-]+)/$" {
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "no-cache" always;
        return 301 /$bare_path$is_args$args;
    }

    # Icons, licence, robots.txt, sitemap, the static pages and anything else: revalidated every time
    # (small files, 304s). With a day of caching the CDN kept serving the old app icon for hours after a
    # release, and the installed app's offline copy stored that stale file. no-transform: the CDN must
    # not inject its script into the static pages (the CSP would block it with an error).
    # /faq serves faq.html (the static pages, site/pages.mjs). Unknown paths answer with the app (a
    # mistyped link still opens it) but as a 404, so search engines index only real pages.
    location / {
        include /etc/nginx/nggallery-headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
        # No "$uri/": a folder name would answer with a redirect to itself plus a slash.
        try_files $uri $uri.html =404;
        error_page 404 /index.html;
    }
}

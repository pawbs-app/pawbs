# pawbs pipeline
#   merge requests and other branches → type-check and build the app
#   beta                              → image (amd64 + arm64) → smoke test → tag `beta` → beta site
#   default branch                    → image → smoke test → tags `X.Y.Z` and `latest` → main site
# A release normally reaches the default branch from `beta` (a fast-forward): its commit was already
# built and tested there, so that same image is released, not a rebuild. Only a commit new to the
# registry (one pushed straight to the default branch) is built.
# Released images are in this project's container registry, $CI_REGISTRY_IMAGE
# (registry.gitlab.com/<group>/<project>), tagged with their version (package.json) and `latest`. A build
# waits for its smoke test in $CI_REGISTRY_IMAGE/candidates, tagged with its commit; the build cache is
# in $CI_REGISTRY_IMAGE/cache. So the image's own list holds only released versions.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - check
  - build
  - test
  - release
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"

default:
  interruptible: true

.image-pipeline: &image-pipeline
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "beta"

# The app's version, from package.json ("1.9.3"); a job fails without one.
.version: &version
  - |
    VERSION=$(sed -n 's/^  "version": "\([0-9][0-9.]*\)".*/\1/p' package.json | head -n 1)
    echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

.docker:
  image: docker:29
  services:
    - docker:29-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

check:
  stage: check
  image: node:26-alpine
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "beta"
      when: never
    - when: on_success
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run build

# Known vulnerabilities in what ships to browsers (the build tools never reach the image). A warning,
# not a gate: an advisory published overnight, or the registry not answering, must not block a release.
audit:
  stage: check
  image: node:26-alpine
  rules: *image-pipeline
  allow_failure: true
  script:
    - npm audit --omit=dev --audit-level=high

build-image:
  extends: .docker
  stage: build
  rules: *image-pipeline
  variables:
    # The whole history: a beta build's label counts the commits since the version last changed.
    GIT_DEPTH: "0"
  script:
    - *version
    # A commit already in the registry (built on `beta`, then promoted) keeps its image: what ships is
    # what the beta site ran. On the default branch it must bring a version not released yet (the
    # "Release X.Y.Z" commit made on `beta`), or a beta-labelled image would go out under an old version.
    - |
      CANDIDATE="$CI_REGISTRY_IMAGE/candidates:$CI_COMMIT_SHORT_SHA"
      if docker buildx imagetools inspect "$CANDIDATE" > /dev/null 2>&1; then
        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && docker buildx imagetools inspect "$CI_REGISTRY_IMAGE:$VERSION" > /dev/null 2>&1 \
          && [ "$(docker buildx imagetools inspect --raw "$CANDIDATE" | sha256sum)" != "$(docker buildx imagetools inspect --raw "$CI_REGISTRY_IMAGE:$VERSION" | sha256sum)" ]; then
          echo "$VERSION is already released: commit a release (a new version) on beta, then promote it" >&2
          exit 1
        fi
        echo "Keeping the image already built for $CI_COMMIT_SHORT_SHA"
        exit 0
      fi
    # Between releases a `beta` build is a pre-release of the next patch version: when package.json's
    # version is already released (its image tag exists), the build is "<next patch>-beta.<commits since
    # the version last changed>" (1.16.16-beta.3), so version numbers are spent only on releases. The
    # release commit itself builds as X.Y.Z, the image the default branch then releases.
    - |
      LABEL=$VERSION
      if [ "$CI_COMMIT_BRANCH" = beta ] && docker buildx imagetools inspect "$CI_REGISTRY_IMAGE:$VERSION" > /dev/null 2>&1; then
        apk add --no-cache git > /dev/null
        git config --global --add safe.directory "$CI_PROJECT_DIR"
        BASE=$(git log -1 --format=%H -G'"version":' -- package.json)
        N=$(git rev-list --count "$BASE..HEAD")
        LABEL=$(echo "$VERSION" | awk -F. '{ print $1 "." $2 "." $3 + 1 }')-beta.$N
      fi
      echo "Building $LABEL"
    # With dind over TLS, buildx needs an explicit context to create a builder.
    - docker context create ci-context
    - docker buildx create --name ci --driver docker-container --use ci-context
    # The serve stage skips the cache, so each release gets Alpine's current packages, base image
    # included (a cached `apk` layer would only be rebuilt when the alpine:3 image itself changes).
    - >-
      docker buildx build
      --platform linux/amd64,linux/arm64
      --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/cache:buildx
      --no-cache-filter serve
      --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/cache:buildx,mode=max,image-manifest=true,oci-mediatypes=true
      --label org.opencontainers.image.revision=$CI_COMMIT_SHA
      --label org.opencontainers.image.source=$CI_PROJECT_URL
      --label org.opencontainers.image.version=$LABEL
      --build-arg BUILD_REF=$CI_COMMIT_SHORT_SHA
      --build-arg APP_VERSION=$LABEL
      --tag $CI_REGISTRY_IMAGE/candidates:$CI_COMMIT_SHORT_SHA
      --push
      .

# Runs the image just built and checks what a browser depends on.
smoke-test:
  stage: test
  image: alpine:3
  rules: *image-pipeline
  services:
    - name: $CI_REGISTRY_IMAGE/candidates:$CI_COMMIT_SHORT_SHA
      alias: app
  variables:
    # The app container's output (nginx and njs errors) goes into this job's log.
    CI_DEBUG_SERVICES: "true"
  script:
    - apk add --no-cache curl jq
    - |
      set -e
      for i in $(seq 1 30); do curl -fsS http://app:8080/healthz && break; sleep 1; done
      curl -fsS http://app:8080/ | grep '<title>pawbs' > /dev/null
      curl -fsS http://app:8080/ | grep '<link rel="canonical" href="https://pawbs.app/"' > /dev/null
      curl -fsS http://app:8080/robots.txt | grep '^Sitemap: https://pawbs.app/sitemap.xml' > /dev/null
      curl -fsSI http://app:8080/sitemap.xml | grep -iE '^content-type: (application|text)/xml' > /dev/null
      curl -fsSI http://app:8080/og-image.png | grep -i '^content-type: image/png' > /dev/null
      curl -fsS http://app:8080/.well-known/security.txt | grep '^Contact: mailto:contact@pawbs.app' > /dev/null
      curl -fsSI http://app:8080/favicon.ico | grep -i '^content-type: image/' > /dev/null
      curl -fsSI http://app:8080/icons/paw.svg | grep -i '^cache-control: no-cache' > /dev/null
      curl -fsS http://app:8080/llms.txt | grep '^# pawbs' > /dev/null
      # The page itself says what pawbs is, for crawlers that do not run JavaScript.
      curl -fsS http://app:8080/ | grep '<h1>pawbs: a fast, private e621' > /dev/null
      # The static pages (site/pages.mjs, named in site/slugs.json) at their clean addresses, listed in
      # the sitemap.
      for P in $(jq -r '.[]' site/slugs.json); do
        curl -fsS "http://app:8080/$P" | grep '<link rel="canonical" href="https://pawbs.app/'"$P"'">' > /dev/null
        curl -fsS http://app:8080/sitemap.xml | grep "<loc>https://pawbs.app/$P</loc>" > /dev/null
      done
      # One address per page: a trailing slash goes to it (relative, so the CDN's host and scheme hold).
      curl -sSI 'http://app:8080/faq/?x=1' > slash.txt
      cat slash.txt
      grep -q '^HTTP/1.1 301' slash.txt
      grep -qi '^location: /faq?x=1' slash.txt
      curl -fsSI http://app:8080/faq | grep -i '^content-type: text/html' > /dev/null
      curl -fsSI http://app:8080/faq | grep -i '^cache-control:.*no-transform' > /dev/null
      curl -fsSI http://app:8080/ > headers.txt
      cat headers.txt
      grep -qi '^cache-control: no-cache' headers.txt
      # The page must reach browsers untouched by the CDN (no injected scripts).
      grep -qi '^cache-control:.*no-transform' headers.txt
      grep -qi '^referrer-policy: strict-origin-when-cross-origin' headers.txt
      grep -qi '^content-security-policy:' headers.txt
      grep -qi '^x-content-type-options: nosniff' headers.txt
      curl -fsSI http://app:8080/sw.js | grep -i '^cache-control: no-cache' > /dev/null
      curl -fsSI http://app:8080/manifest.webmanifest | grep -i '^content-type: application/manifest+json' > /dev/null
      # Disguises (deploy/disguise.js): the page and manifest made from the address, nothing of pawbs in the page.
      curl -fsS 'http://app:8080/as/calculator/?name=My%20Calc&color=1d9e75' > as.html
      grep -q '<title>My Calc</title>' as.html
      grep -q 'manifest.webmanifest?name=My%20Calc&amp;color=1d9e75' as.html
      if grep -qi 'pawbs' as.html; then echo "A disguise's page names pawbs"; exit 1; fi
      curl -fsS 'http://app:8080/as/calculator/manifest.webmanifest?name=My%20Calc&color=1d9e75' | jq -e '.name == "My Calc" and .id == "/as/calculator/?name=My%20Calc&color=1d9e75"' > /dev/null
      curl -fsSI http://app:8080/as/icons/calculator-1d9e75-192.png | grep -i '^content-type: image/png' > /dev/null
      test "$(curl -sS -o /dev/null -w '%{http_code}' http://app:8080/as/unknown/)" = 404
      test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://app:8080/share-target)" = 303
      ASSET=$(curl -fsS http://app:8080/ | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -n 1)
      test -n "$ASSET"
      curl -fsSI "http://app:8080/$ASSET" | grep -i '^cache-control: public, max-age=31536000, immutable' > /dev/null
      curl -fsS -o /dev/null -D br.txt -H 'Accept-Encoding: br, gzip' "http://app:8080/$ASSET"
      cat br.txt
      grep -qi '^content-encoding: br' br.txt
      grep -qi '^vary: accept-encoding' br.txt
      curl -fsS -o /dev/null -D gz.txt -H 'Accept-Encoding: gzip' "http://app:8080/$ASSET"
      grep -qi '^content-encoding: gzip' gz.txt
      curl -fsS -o /dev/null -D id.txt "http://app:8080/$ASSET"
      if grep -qi '^content-encoding:' id.txt; then echo "A client without compression got a compressed file"; exit 1; fi
      curl -fsS -H 'Accept-Encoding: br' http://app:8080/ -o index.br
      test "$(head -c 15 index.br)" != '<!doctype html>'
      # Unknown addresses: the app (a mistyped link still opens it), but as a 404 for search engines.
      test "$(curl -sS -o unknown.html -w '%{http_code}' http://app:8080/some/unknown/path)" = 404
      grep -q '<title>pawbs' unknown.html
      test "$(curl -sS -o /dev/null -w '%{http_code}' 'http://app:8080/?site=x')" = 200
      test "$(curl -sS -o /dev/null -w '%{http_code}' http://app:8080/index.html)" = 200
      # Device transfer relay (deploy/sync.js under njs): each transfer is handed out once.
      grep -qi '^permissions-policy: camera=(self)' headers.txt
      R=http://app:8080/sync/v1
      # The page "Pass the check" opens: HTML untouched by the CDN, with its own script; at /check,
      # and under the relay for app versions 1.9.17 and before.
      for C in http://app:8080/check "$R/check"; do
        curl -fsS -D check.txt "$C" | grep 'check.js' > /dev/null
        grep -qi '^content-type: text/html' check.txt
        grep -qi '^cache-control:.*no-transform' check.txt
        curl -fsSI "$C.js" | grep -i '^content-type: .*javascript' > /dev/null
      done
      # api <expected status> <curl args…>: prints the response body; any other status fails the job,
      # showing what came back (njs errors are in the service log, CI_DEBUG_SERVICES).
      api() {
        want=$1; shift
        st=$(curl -s -o body.txt -w '%{http_code}' "$@")
        if [ "$st" != "$want" ]; then echo "Relay: expected $want, got $st" >&2; head -c 600 body.txt >&2; echo >&2; exit 1; fi
        cat body.txt
      }
      is() { jq -e "$1" > /dev/null || { echo "Relay: the answer is not $1" >&2; exit 1; }; }
      api 200 "$R/health" | is '.ok == true and .ttl == 300'
      curl -fsSI "$R/health" | grep -i '^cache-control: no-store' > /dev/null
      S=$(api 201 -X POST -H 'Content-Type: application/json' -d '{"data":"aGVsbG8="}' "$R/slots")
      ID=$(echo "$S" | jq -r .id)
      echo "$ID" | grep -Eq '^[A-Za-z0-9_-]{22}$'
      api 200 "$R/slots/$ID/status" | is '.state == "waiting"'
      api 200 "$R/slots/$ID" | is '.data == "aGVsbG8="'
      api 200 "$R/slots/$ID/status" | is '.state == "taken"'
      api 404 "$R/slots/$ID" > /dev/null
      # The code salts: this 5-minute window's and the last one's, different, both secret-derived.
      api 200 "$R/salt" | is '(.cur | type) == "string" and (.prev | type) == "string" and .cur != .prev and .period == 300'
      # The 8-digit code path: found by its lookup, once; a lookup already in use is refused; a claim
      # carries this window's and the last window's lookups.
      L=$(printf '%064d' 0 | tr 0 a)
      L2=$(printf '%064d' 0 | tr 0 b)
      BODY="{\"data\":\"aGVsbG8=\",\"code\":{\"lookup\":\"$L\",\"wrapped\":\"d3JhcA==\"}}"
      api 201 -X POST -H 'Content-Type: application/json' -d "$BODY" "$R/slots" > /dev/null
      api 409 -X POST -H 'Content-Type: application/json' -d "$BODY" "$R/slots" > /dev/null
      api 200 -X POST -H 'Content-Type: application/json' -d "{\"lookups\":[\"$L2\",\"$L\"]}" "$R/claim" | is '.data == "aGVsbG8=" and .wrapped == "d3JhcA==" and .lookup == "'"$L"'"'
      api 404 -X POST -H 'Content-Type: application/json' -d "{\"lookups\":[\"$L\"]}" "$R/claim" > /dev/null
      # Older clients: a per-transfer salt and a single lookup.
      api 201 -X POST -H 'Content-Type: application/json' -d "{\"data\":\"aGVsbG8=\",\"code\":{\"lookup\":\"$L2\",\"salt\":\"c2FsdA==\",\"wrapped\":\"d3JhcA==\"}}" "$R/slots" > /dev/null
      api 200 -X POST -H 'Content-Type: application/json' -d "{\"lookup\":\"$L2\"}" "$R/claim" | is '.salt == "c2FsdA=="'
      # Only the app itself: no JSON, or a request another site makes the browser send, is refused.
      api 415 -X POST -H 'Content-Type: text/plain' -d '{"data":"aGVsbG8="}' "$R/slots" > /dev/null
      api 403 -X POST -H 'Content-Type: application/json' -H 'Sec-Fetch-Site: cross-site' -d '{"data":"aGVsbG8="}' "$R/slots" > /dev/null
      api 403 -H 'Sec-Fetch-Site: cross-site' "$R/salt" > /dev/null
      # The sender cancels: only with its owner token.
      S=$(api 201 -X POST -H 'Content-Type: application/json' -d '{"data":"aGVsbG8="}' "$R/slots")
      ID=$(echo "$S" | jq -r .id)
      OWNER=$(echo "$S" | jq -r .owner)
      api 403 -X DELETE -H 'X-Owner: nope' "$R/slots/$ID" > /dev/null
      api 204 -X DELETE -H "X-Owner: $OWNER" "$R/slots/$ID" > /dev/null
      api 200 "$R/slots/$ID/status" | is '.state == "gone"'
      # A large transfer (6 MB) goes through intact; malformed ones and unknown paths do not.
      head -c 4500000 /dev/urandom > big.bin
      { printf '{"data":"'; base64 -w 0 big.bin; printf '"}'; } > big.json
      S=$(api 201 -X POST -H 'Content-Type: application/json' --data-binary @big.json "$R/slots")
      ID=$(echo "$S" | jq -r .id)
      api 200 "$R/slots/$ID" | jq -r .data | base64 -d | cmp - big.bin
      api 400 -X POST -H 'Content-Type: application/json' -d 'not json' "$R/slots" > /dev/null
      api 400 -X POST -H 'Content-Type: application/json' -d '{"lookup":"xyz"}' "$R/claim" > /dev/null
      api 404 "$R/nothing" | is '.error == "unavailable"'
      # Nothing about the server shows: no redirect to the container's port, neutral error pages, and a
      # missing asset is not cached for a year.
      curl -sS -o /dev/null -D dir.txt http://app:8080/assets
      if grep -qi '^location:' dir.txt; then echo "A folder name answered with a redirect"; cat dir.txt; exit 1; fi
      curl -sS -o missing.txt -D missing-h.txt http://app:8080/assets/nope.js
      grep -q '^HTTP/1.1 404' missing-h.txt
      if grep -qi 'nginx' missing.txt; then echo "An error page names the server"; exit 1; fi
      if grep -qi 'immutable' missing-h.txt; then echo "A missing asset is cached for a year"; exit 1; fi
      grep -qi '^cross-origin-opener-policy: same-origin' headers.txt
      grep -qi "frame-ancestors 'none'" headers.txt
      # The beta channel: the same image at a "beta." address keeps search engines away (pages and
      # files alike); the main site does not.
      curl -fsSI -H 'Host: beta.pawbs.app' http://app:8080/ | grep -i '^x-robots-tag: noindex' > /dev/null
      curl -fsSI -H 'Host: beta.pawbs.app' http://app:8080/faq | grep -i '^x-robots-tag: noindex' > /dev/null
      curl -fsSI -H 'Host: beta.pawbs.app' "http://app:8080/$ASSET" | grep -i '^x-robots-tag: noindex' > /dev/null
      curl -fsSI -H 'Host: pawbs.app' http://app:8080/ > main.txt
      if grep -qi '^x-robots-tag' headers.txt main.txt; then echo "The main site asks not to be indexed"; exit 1; fi
      echo "Smoke test passed"

# The tested build goes to the beta site: tagged `beta`.
release-beta:
  extends: .docker
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == "beta"
  script:
    - docker buildx imagetools create --tag "$CI_REGISTRY_IMAGE:beta" "$CI_REGISTRY_IMAGE/candidates:$CI_COMMIT_SHORT_SHA"
    - echo "Released $CI_REGISTRY_IMAGE:beta from $CI_COMMIT_SHORT_SHA"

# The tested build becomes the release: tagged with its version and `latest`. (A commit that does not
# change the version moves that version's tag to its newer build.)
release:
  extends: .docker
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - *version
    - docker buildx imagetools create --tag "$CI_REGISTRY_IMAGE:$VERSION" --tag "$CI_REGISTRY_IMAGE:latest" "$CI_REGISTRY_IMAGE/candidates:$CI_COMMIT_SHORT_SHA"
    - echo "Released $CI_REGISTRY_IMAGE:$VERSION (and latest) from $CI_COMMIT_SHORT_SHA"

# Redeploys once `latest` points at the new image: POSTs to DEPLOY_WEBHOOK_URL (Settings › CI/CD ›
# Variables, masked), for example a container manager's stack webhook whose compose has
# `pull_policy: always`. Without the variable the job is skipped. Only the HTTP status is printed: a
# response body (an error page, a CDN challenge) can repeat the URL, whose path is the secret.
deploy:
  stage: deploy
  image: alpine:3
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_WEBHOOK_URL
  environment:
    name: production
    url: https://pawbs.app
  script:
    - apk add --no-cache curl
    - curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 120 -o /dev/null -w 'Webhook answered HTTP %{http_code}\n' -X POST "$DEPLOY_WEBHOOK_URL"
    - echo "Redeploy requested for $CI_COMMIT_SHORT_SHA"

# The same for the beta site, once `beta` points at the new image: DEPLOY_BETA_WEBHOOK_URL (masked and
# protected too) is the beta site's own stack webhook.
deploy-beta:
  stage: deploy
  image: alpine:3
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == "beta" && $DEPLOY_BETA_WEBHOOK_URL
  environment:
    name: beta
    url: https://beta.pawbs.app
  script:
    - apk add --no-cache curl
    - curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 120 -o /dev/null -w 'Webhook answered HTTP %{http_code}\n' -X POST "$DEPLOY_BETA_WEBHOOK_URL"
    - echo "Beta redeploy requested for $CI_COMMIT_SHORT_SHA"
